<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker Pro | App Moderna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Efecto Glassmorphism sutil para paneles oscuros */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* slate-800 con transparencia */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Animación suave para las barras de progreso */
        .progress-bar { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 selection:bg-indigo-500 selection:text-white">

    <nav class="fixed top-0 w-full z-50 glass-panel border-b-0 border-b-slate-800">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💪</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FitTrack Pro</h1>
            </div>
            <div class="flex gap-3">
                <button id="btn-backup" class="p-2 rounded-full hover:bg-slate-700 text-slate-400 hover:text-white transition" title="Respaldar Datos">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
                <label class="p-2 rounded-full hover:bg-slate-700 text-slate-400 hover:text-white transition cursor-pointer" title="Importar Datos">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <input type="file" id="file-import" class="hidden" accept=".json">
                </label>
                <button id="btn-delete-all" class="p-2 rounded-full hover:bg-rose-700 text-rose-400 hover:text-white transition" title="Eliminar Todos los Datos Locales">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pt-24 space-y-8">

        <section id="goals-section" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-panel p-5 rounded-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition text-6xl">🏃</div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Cardio Semanal</h3>
                <div class="flex items-end gap-2 mt-1">
                    <span id="stat-cardio" class="text-3xl font-bold text-white">0</span>
                    <span class="text-sm text-slate-500 mb-1">/ <span id="goal-cardio-display">90</span> min</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                    <div id="bar-cardio" class="progress-bar h-full bg-gradient-to-r from-cyan-500 to-blue-500 w-0"></div>
                </div>
            </div>
            
            <div class="glass-panel p-5 rounded-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition text-6xl">🏋️</div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Fuerza (Reps)</h3>
                <div class="flex items-end gap-2 mt-1">
                    <span id="stat-strength" class="text-3xl font-bold text-white">0</span>
                    <span class="text-sm text-slate-500 mb-1">/ <span id="goal-strength-display">300</span> reps</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                    <div id="bar-strength" class="progress-bar h-full bg-gradient-to-r from-violet-500 to-fuchsia-500 w-0"></div>
                </div>
            </div>

            <button id="btn-set-goals" class="glass-panel p-5 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition border-dashed border-2 border-slate-700">
                <span class="text-2xl">🎯</span>
                <span class="text-sm font-medium text-slate-300">Configurar Metas</span>
            </button>
        </section>

        <div class="flex justify-center p-1 bg-slate-900/50 rounded-xl backdrop-blur max-w-lg mx-auto">
            <button id="nav-register" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-500/30">Registrar</button>
            <button id="nav-stats" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition-all">Estadísticas</button>
            <button id="nav-weight" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition-all">Peso</button>
            <button id="nav-history" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition-all">Historial</button>
        </div>

        <div id="view-register" class="space-y-6">
            <div id="exercise-selection" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                
                <button data-exercise="Correr" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-indigo-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🏃</div>
                    <div class="font-semibold text-sm">Correr</div>
                    <div class="text-xs text-slate-500">Distancia</div>
                </button>
                <button data-exercise="Caminar" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-indigo-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🚶</div>
                    <div class="font-semibold text-sm">Caminar</div>
                    <div class="text-xs text-slate-500">Pasos</div>
                </button>
                <button data-exercise="Bicicleta" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-indigo-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🚴</div>
                    <div class="font-semibold text-sm">Bicicleta</div>
                    <div class="text-xs text-slate-500">Tiempo</div>
                </button>
                <button data-exercise="Levantar Pesas" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-indigo-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🏋️</div>
                    <div class="font-semibold text-sm">Pesas</div>
                    <div class="text-xs text-slate-500">Reps</div>
                </button>
                <button data-exercise="Sentadillas" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-indigo-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🍑</div>
                    <div class="font-semibold text-sm">Sentadillas</div>
                    <div class="text-xs text-slate-500">Reps</div>
                </button>
                <button data-exercise="Flexiones" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-indigo-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">💪</div>
                    <div class="font-semibold text-sm">Flexiones</div>
                    <div class="text-xs text-slate-500">Reps</div>
                </button>
                
                <button data-exercise="Plancha" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-cyan-500/50 relative overflow-hidden">
                    <div class="absolute right-0 top-0 p-1 opacity-20 text-4xl">⏱️</div>
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🪵</div>
                    <div class="font-semibold text-sm text-cyan-200">Plancha</div>
                    <div class="text-xs text-slate-500">Tiempo</div>
                </button>
                <button data-exercise="Crunches" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-cyan-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🍫</div>
                    <div class="font-semibold text-sm text-cyan-200">Crunches</div>
                    <div class="text-xs text-slate-500">Cortos</div>
                </button>
                <button data-exercise="Elev. Piernas" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-cyan-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🦵</div>
                    <div class="font-semibold text-sm text-cyan-200">Elev. Piernas</div>
                    <div class="text-xs text-slate-500">Inferiores</div>
                </button>
                <button data-exercise="Giros Rusos" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-cyan-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🌪️</div>
                    <div class="font-semibold text-sm text-cyan-200">Giros Rusos</div>
                    <div class="text-xs text-slate-500">Oblicuos</div>
                </button>
                <button data-exercise="Escaladores" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-cyan-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🧗</div>
                    <div class="font-semibold text-sm text-cyan-200">Escaladores</div>
                    <div class="text-xs text-slate-500">Core</div>
                </button>
                <button data-exercise="Tijeras" class="glass-panel p-4 rounded-xl hover:bg-slate-800 transition text-left group border border-transparent hover:border-cyan-500/50">
                    <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">✂️</div>
                    <div class="font-semibold text-sm text-cyan-200">Tijeras</div>
                    <div class="text-xs text-slate-500">Reps</div>
                </button>

            </div>

            <div id="exercise-input" class="hidden glass-panel p-6 rounded-2xl border-l-4 border-indigo-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <span id="current-exercise-icon" class="text-2xl"></span>
                        <span id="current-exercise-name">Ejercicio</span>
                    </h2>
                    <button id="cancel-input" class="text-slate-400 hover:text-white">Cancelar</button>
                </div>

                <div class="space-y-4">
                    <div id="input-container">
                        <div id="dynamic-input-group">
                            <label class="block text-sm font-medium text-slate-400 mb-1" id="dynamic-label">Valor</label>
                            <input type="number" id="dynamic-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="0">
                        </div>
                    </div>
                    
                    <button id="save-exercise" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-indigo-500/20 transition-all transform active:scale-95">
                        Guardar Actividad
                    </button>
                </div>
            </div>
        </div>

        <div id="view-stats" class="hidden space-y-6">
            <div class="flex justify-center gap-2 mb-4">
                <button class="view-period-btn active px-4 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white" data-period="week">Semana</button>
                <button class="view-period-btn px-4 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700" data-period="month">Mes</button>
                <button class="view-period-btn px-4 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700" data-period="year">Año</button>
            </div>

            <div class="glass-panel p-4 rounded-2xl h-80 w-full relative">
                <canvas id="exerciseChart"></canvas>
            </div>
            
            <div class="text-center text-xs text-slate-500 mt-2">
                <span id="current-period-display">Periodo Actual</span>
            </div>
        </div>

        <div id="view-weight" class="hidden space-y-6">
            <div class="glass-panel p-6 rounded-2xl border-l-4 border-emerald-500">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-300">
                    <span class="text-2xl">⚖️</span>
                    Registro de Peso Corporal
                </h2>
                <div class="flex flex-col sm:flex-row gap-4 mb-4">
                    <input type="number" id="weight-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" placeholder="Peso (ej: 75.5 kg)">
                    <input type="date" id="weight-date-input" class="w-full sm:w-auto bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
                    <button id="save-weight" class="w-full sm:w-auto bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold py-3 px-6 rounded-lg shadow-lg shadow-emerald-500/20 transition-all transform active:scale-95">
                        Guardar
                    </button>
                </div>
            </div>

            <div class="glass-panel p-4 rounded-2xl h-80 w-full relative">
                <h3 class="text-lg font-semibold mb-2 text-emerald-300">Progreso de Peso</h3>
                <canvas id="weightChart"></canvas>
            </div>

            <div class="glass-panel p-4 rounded-2xl">
                <h3 class="text-lg font-semibold mb-3 text-slate-300">Historial de Registros</h3>
                <div id="weight-records-list" class="space-y-3">
                    </div>
                <div id="no-weight-records-message" class="hidden text-center py-5 text-slate-500">
                    <p>No hay registros de peso aún.</p>
                </div>
            </div>
        </div>

        <div id="view-history" class="hidden">
            <div id="records-list" class="space-y-3">
                </div>
            <div id="no-records-message" class="hidden text-center py-10 text-slate-500">
                <p>No hay registros de ejercicios aún.</p>
            </div>
        </div>

    </main>

    <dialog id="modal-goals" class="bg-transparent backdrop:bg-black/80 p-0 w-full max-w-md">
        <div class="glass-panel bg-slate-900 border border-slate-700 p-6 rounded-2xl shadow-2xl m-4">
            <h3 class="text-xl font-bold mb-4 text-white">Configurar Metas Semanales</h3> 
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Minutos de Cardio</label>
                    <input type="number" id="input-goal-cardio" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Repeticiones de Fuerza</label>
                    <input type="number" id="input-goal-strength" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
                </div>
                <div class="flex gap-2 pt-2">
                    <button id="btn-cancel-goals" class="flex-1 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white">Cancelar</button>
                    <button id="btn-save-goals" class="flex-1 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-bold text-white">Guardar</button>
                </div>
            </div>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
