<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack Cloud Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-10">

    <nav class="fixed top-0 w-full z-50 glass-panel border-b-slate-800 h-16 flex items-center justify-between px-6">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FitTrack Pro</h1>
        <div id="sync-status" class="text-[10px] font-bold text-emerald-500 flex items-center gap-1">
            <span id="status-dot" class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> 
            <span id="status-text">ONLINE</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pt-24 space-y-8">
        <div class="flex p-1 bg-slate-900/50 rounded-2xl glass-panel max-w-sm mx-auto">
            <button onclick="showView('register')" id="btn-nav-register" class="flex-1 py-2 rounded-xl text-sm font-medium bg-indigo-600">Registrar</button>
            <button onclick="showView('stats')" id="btn-nav-stats" class="flex-1 py-2 rounded-xl text-sm font-medium text-slate-400">Stats</button>
            <button onclick="showView('history')" id="btn-nav-history" class="flex-1 py-2 rounded-xl text-sm font-medium text-slate-400">Historial</button>
        </div>

        <div id="view-register" class="space-y-6">
            <div id="exercise-selection" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <button onclick="openInput('Correr', 'km', '🏃')" class="glass-panel p-5 rounded-2xl hover:bg-slate-800 transition text-left font-bold">🏃 Correr</button>
                <button onclick="openInput('Flexiones', 'reps', '💪')" class="glass-panel p-5 rounded-2xl hover:bg-slate-800 transition text-left font-bold">💪 Flexiones</button>
                <button onclick="openInput('Sentadillas', 'reps', '🍑')" class="glass-panel p-5 rounded-2xl hover:bg-slate-800 transition text-left font-bold">🍑 Sentadillas</button>
                <button onclick="openInput('Plancha', 'min', '🪵')" class="glass-panel p-5 rounded-2xl hover:bg-slate-800 transition text-left font-bold">🪵 Plancha</button>
                <button onclick="openInput('Bench Press', 'reps', '🏋️‍♂️')" class="glass-panel p-5 rounded-2xl hover:bg-slate-800 transition text-left font-bold">🏋️‍♂️ Bench Press</button>
                <button onclick="openInput('Abdominales', 'reps', '🧘')" class="glass-panel p-5 rounded-2xl hover:bg-slate-800 transition text-left font-bold">🧘 Abdominales</button>
                <button onclick="openInput('Peso', 'kg', '⚖️')" class="glass-panel p-5 rounded-2xl border-emerald-500/20 hover:bg-emerald-900/30 transition text-left font-bold text-emerald-400">⚖️ Peso</button>
            </div>
            
            <div id="input-panel" class="hidden glass-panel p-8 rounded-3xl border-t-4 border-indigo-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="input-title" class="text-2xl font-bold"></h2>
                    <button onclick="closeInput()" class="text-slate-500">Cerrar</button>
                </div>
                <input type="number" id="main-input" class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-2xl text-center mb-6 focus:border-indigo-500 outline-none text-white" placeholder="0.0">
                <button id="btn-save-main" onclick="handleSave()" class="w-full bg-indigo-600 py-4 rounded-2xl font-extrabold text-lg transition shadow-xl shadow-indigo-500/20 active:scale-95">Guardar</button>
            </div>
        </div>

        <div id="view-stats" class="hidden space-y-6">
            <div class="glass-panel p-6 rounded-3xl space-y-6">
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="setPeriod('week')" class="period-btn px-4 py-1.5 rounded-full text-xs font-bold bg-indigo-600">Semana</button>
                    <button onclick="setPeriod('month')" class="period-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-800">Mes</button>
                    <button onclick="setPeriod('year')" class="period-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-800">Año</button>
                </div>
                <div class="flex justify-between items-center px-4">
                    <button onclick="changeDate(-1)" class="text-indigo-400 font-bold hover:scale-110 transition">← Anterior</button>
                    <span id="current-period-label" class="font-bold text-sm text-slate-300"></span>
                    <button onclick="changeDate(1)" class="text-indigo-400 font-bold hover:scale-110 transition">Siguiente →</button>
                </div>
                <div class="h-64"><canvas id="chartEx"></canvas></div>
            </div>
            <div class="glass-panel p-6 rounded-3xl h-64"><canvas id="chartWeight"></canvas></div>
        </div>

        <div id="view-history" class="hidden space-y-3">
            <div id="history-list" class="space-y-3"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
